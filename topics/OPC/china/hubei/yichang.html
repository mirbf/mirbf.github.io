        <section class="city-badge">
            <span class="badge badge-success">✓ 已实施</span>

        <section class="overview-section">
            <h2>推进概况</h2>
            <p>由<strong>宜昌大数据集团</strong>打造的<strong>"宜数"OPC创新社区</strong>正式启动入驻招募，面向全国个人经济体、小微数字创业团队开放申请。这是宜昌市启用的<strong>首个数据开发OPC社区</strong>。</p>
            <p>省级层面，《若干措施》提出在<strong>湖北省公共数据开放网设立OPC专区</strong>，围绕实际需求提供定制化、高质量公共数据资源，鼓励参与公共数据产品再开发。</p>
        </section>
